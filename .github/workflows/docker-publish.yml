name: Docker

# Packages a rusthinq release into the image and the Home Assistant add-on.
#
#   * By hand: Actions -> Docker -> Run workflow, with the rusthinq release tag.
#   * From rusthinq's own release workflow, once that release is published:
#       gh api repos/3735943886/rusthinq-docker/dispatches \
#         -f event_type=rusthinq-release -F 'client_payload[tag]=v0.1.0'
#
# Secrets:
#   DOCKER_USERNAME / DOCKER_PASSWORD   Docker Hub login, as for rustuya-manager
#   RUSTHINQ_TOKEN                      optional: a token that can read the rusthinq
#                                       repository's releases, only if it goes private again
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "rusthinq release tag (e.g. v0.1.0)"
        required: true
        type: string
  repository_dispatch:
    types: [rusthinq-release]

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: 3735943886/rusthinq

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag
        run: |
          case "$TAG" in
            v0.1.* | v0.2.*) ;;
            *) echo "release tag must be v0.1.* or v0.2.*, got '$TAG'" >&2; exit 1 ;;
          esac
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Fetch rusthinq binaries
        env:
          GH_TOKEN: ${{ secrets.RUSTHINQ_TOKEN || github.token }}
        run: scripts/fetch-release.sh "$TAG"

      - name: Decide image tags
        id: tags
        # A plain X.Y.Z is a stable release and also moves :X.Y and :latest. Anything
        # with a suffix (0.1.0-dev1, -rc1, ...) only gets its exact tag.
        run: |
          tags="$IMAGE:$VERSION"
          stable=false
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            stable=true
            tags="$tags,$IMAGE:${VERSION%.*}"
            case "$VERSION" in 0.2.*) tags="$tags,$IMAGE:latest" ;; esac
          fi
          echo "Will push: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.tags.outputs.tags }}

      # The add-on pulls 3735943886/rusthinq:<its own version>, so its version moves
      # only once a stable release image exists.
      - name: Point the add-on at this version
        if: steps.tags.outputs.stable == 'true'
        run: |
          case "$VERSION" in
            0.1.*) addon=rusthinq-legacy ;;
            0.2.*) addon=rusthinq ;;
            *) echo "Unsupported release family" >&2; exit 1 ;;
          esac
          sed -i "s/^version: .*/version: \"$VERSION\"/" "$addon/config.yaml"
          if ! grep -q "^## $VERSION\$" "$addon/CHANGELOG.md"; then
            printf '\n## %s\n\n- Packages rusthinq %s.\n' "$VERSION" "$TAG" >> "$addon/CHANGELOG.md"
          fi
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add-on $VERSION"
          git push
